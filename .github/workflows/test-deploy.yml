name: Test deployment
on:
    push:
        branches:
            - docusaurus
            - main
jobs:
    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: npm
                  cache-dependency-path: "./"
            - name: Install dependencies
              run: npm install
            - name: Build website
              run: npm run build
